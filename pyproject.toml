[project]
name = "open-agent-contract"
version = "0.1.0"
description = "Spesifikasjon + implementasjon av verifiserbare agentkontraktar. Knytt til REHT/RACS/BO#42."
authors = [{name = "nsolland"}]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
